<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول المدير</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.box{max-width:420px;margin:70px auto;background:white;padding:25px;border-radius:12px}
.box input{width:100%;margin:10px 0;padding:13px}
button{background:#10243e;color:white;border:0;padding:13px 25px;border-radius:7px;width:100%;font-size:17px}
.error{color:#b52d35}
</style>
</head>
<body>
<div class="box">
<h2>🔐 دخول المدير</h2>
{% with messages = get_flashed_messages() %}
{% for message in messages %}
<p class="error">{{ message }}</p>
{% endfor %}
{% endwith %}
<form method="POST">
<label>اسم المستخدم</label>
<input type="text" name="username" required autocomplete="username">
<label>كلمة المرور</label>
<input type="password" name="password" required autocomplete="current-password">
<button type="submit">تسجيل الدخول</button>
</form>
<p><a href="/">العودة للموقع</a></p>
</div>
</body>
</html>
