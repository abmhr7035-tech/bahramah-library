<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ article.title }} | بحر أمة</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
<h1>وكالة بحر أمة الإخبارية</h1>
<nav><a href="/">الرئيسية</a></nav>
</header>
<main>
<article class="about-section">
<span class="category-tag">{{ article.category }}</span>
<h1>{{ article.title }}</h1>
<p>{{ article.created_at }}</p>
{% if article.image %}
<img src="{{ url_for('static', filename='uploads/' + article.image) }}"
alt="{{ article.title }}" style="width:100%;max-height:450px;object-fit:contain">
{% endif %}
<h3>{{ article.summary }}</h3>
<div style="white-space:pre-wrap;line-height:2">{{ article.content }}</div>
<br>
<a href="/">العودة إلى الصفحة الرئيسية</a>
</article>
</main>
</body>
</html>
